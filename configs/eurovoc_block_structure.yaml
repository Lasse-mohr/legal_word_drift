# EuroVoc labels that show block structure in average-pairwise distance
# heatmaps (per the 2026-05-12 research note). Grouped by qualitative
# "clarity" of the block pattern. Used as candidate vocabulary for the
# linear-probe per-label sweep (scripts/eurovoc_drift/06_linear_probe_per_label.py).
#
# Schema:
#   <clarity_tier>:
#     - label: <eurovoc preferred or alt label>
#       domain: <eurovoc domain>
#       notes: <free text, may be empty>
#
# Predefined subsets pick 5 labels for the calibration-scale run.

