# Predefined subsets. Each subset is a list of label strings; the script
# resolves each back to its clarity/domain/notes via the tiers above.
subsets:
  clarity_spread:
    description: >
      One label per clarity tier (very_clear → very_slight), covering four
      distinct EuroVoc domains. Used for the initial 5-word calibration of
      the EuroVoc linear-probe sweep.
    labels:
      - stress
      - ukraine
      - accused
      - composition
      - bird
